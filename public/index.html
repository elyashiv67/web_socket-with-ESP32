<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>ESP32 Control Panel</h1>

        <p class="section-title">Send to ESP</p>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Enter message...">
            <button class="btn-send" onclick="sendMessage(document.getElementById('messageInput').value)">Send</button>
        </div>

        <p class="section-title">Received from ESP</p>
        <div class="status-box" id="receivedMessage">waiting...</div>

        <button class="btn-reset" id="rst_btn">Reset</button>
    </div>

    <script src="webSocket.js"></script>
</body>
</html>
